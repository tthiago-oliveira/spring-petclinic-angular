<div class="container-fluid main-wrapper px-0" *ngIf="authService.isLoggedIn()">
  <nav class="navbar navbar-expand-lg navbar-petclinic w-100" aria-label="Main navigation">
    <div class="container-fluid">
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#petclinicNavbar"
        aria-controls="petclinicNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <a class="navbar-brand" routerLink="/welcome" aria-label="Spring Petclinic home"><span></span></a>

      <div id="petclinicNavbar" class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/welcome" routerLinkActive="active">
              <i class="bi bi-house-fill" aria-hidden="true"></i>
              <span> Painel</span>
            </a>
          </li>

          <li class="nav-item dropdown" routerLinkActive="active">
            <button class="nav-link dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-fill" aria-hidden="true"></i>
              Tutores &amp; Pets
            </button>
            <ul class="dropdown-menu">
              <li>
                <a class="dropdown-item" routerLink="/owners">
                  <i class="bi bi-search" aria-hidden="true"></i>
                  <span> Buscar Tutores</span>
                </a>
              </li>
              <li>
                <a class="dropdown-item" routerLink="/owners/add">
                  <i class="bi bi-plus-lg" aria-hidden="true"></i>
                  <span> Cadastrar Tutor</span>
                </a>
              </li>
            </ul>
          </li>

          <li class="nav-item dropdown" routerLinkActive="active">
            <button class="nav-link dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-mortarboard-fill" aria-hidden="true"></i>
              Veterinários
            </button>
            <ul class="dropdown-menu">
              <li>
                <a class="dropdown-item" routerLink="/vets">
                  <i class="bi bi-search" aria-hidden="true"></i>
                  <span> Listar Todos</span>
                </a>
              </li>
              <li *ngIf="authService.canManageVets()">
                <a class="dropdown-item" routerLink="/vets/add">
                  <i class="bi bi-plus-lg" aria-hidden="true"></i>
                  <span> Cadastrar Veterinário</span>
                </a>
              </li>
            </ul>
          </li>

          <li class="nav-item" *ngIf="authService.canManageVets()">
            <a class="nav-link" routerLink="/pettypes" routerLinkActive="active">
              <i class="bi bi-heart-fill" aria-hidden="true"></i>
              <span> Espécies</span>
            </a>
          </li>

          <li class="nav-item" *ngIf="authService.canManageVets()">
            <a class="nav-link" routerLink="/specialties" routerLinkActive="active">
              <i class="bi bi-list-ul" aria-hidden="true"></i>
              <span> Especialidades</span>
            </a>
          </li>

          <li class="nav-item" *ngIf="authService.isAdmin()">
            <a class="nav-link" routerLink="/staff" routerLinkActive="active">
              <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
              <span> Equipe (Admin)</span>
            </a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3 text-white">
          <span class="small">
            <i class="bi bi-person-circle me-1"></i>
            <strong>{{ authService.getUsername() }}</strong>
            <span class="badge bg-secondary ms-1">{{ authService.getProfileLabel() }}</span>
          </span>
          <button type="button" class="btn btn-outline-light btn-sm" (click)="authService.logout()">
            <i class="bi bi-box-arrow-right me-1"></i>Sair
          </button>
        </div>
      </div>
    </div>
  </nav>
</div>

<main class="content-wrapper">
  <router-outlet></router-outlet>
</main>

<footer class="container-fluid footer-wrapper">
  <div class="row h-100 align-items-center">
    <div class="col-12 text-center">
      <img src="./assets/images/angular.png" alt="Angular" height="60" width="60" />
      <img src="./assets/images/spring-pivotal-logo.png" alt="Sponsored by Pivotal" height="45" />
    </div>
  </div>
</footer>
