<div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
  <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
  <button type="button" class="btn-close" (click)="errorMessage = ''"></button>
</div>

<table [hidden]="deleteSuccess" class="table table-bordered align-middle bg-white shadow-sm mb-3">
  <tr>
    <td valign="top" style="width: 38%">
      <dl class="row mb-3">
        <dt class="col-sm-4">Nome do Pet</dt>
        <dd class="col-sm-8 fw-bold">{{ pet.name }}</dd>

        <dt class="col-sm-4">Nascimento</dt>
        <dd class="col-sm-8">{{ pet.birthDate }}</dd>

        <dt class="col-sm-4">Espécie</dt>
        <dd class="col-sm-8" *ngIf="!deleteSuccess">{{ pet.type?.name }}</dd>
      </dl>

      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="editPet(pet)">
          <i class="bi bi-pencil-fill me-1"></i>Editar Pet
        </button>
        <button type="button" class="btn btn-success btn-sm" (click)="addVisit(pet)">
          <i class="bi bi-calendar-plus-fill me-1"></i>Agendar Consulta
        </button>
        <button type="button" class="btn btn-outline-danger btn-sm" (click)="openDeleteModal()">
          <i class="bi bi-trash-fill me-1"></i>Excluir Pet
        </button>
      </div>
    </td>

    <td valign="top">
      <app-visit-list [visits]="pet.visits" [petId]="pet.id"></app-visit-list>
    </td>
  </tr>
</table>

<!-- Modal de Confirmação de Exclusão de Pet -->
<div
  *ngIf="showDeleteModal"
  class="modal d-block"
  tabindex="-1"
  style="background: rgba(0, 0, 0, 0.55)"
  role="dialog"
  aria-modal="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">
          <i class="bi bi-exclamation-octagon-fill me-2"></i>Confirmar Exclusão do Pet
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="cancelDelete()"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2">
          Tem certeza que deseja excluir o pet <strong>{{ pet.name }}</strong>?
        </p>
        <p class="text-muted small mb-0">
          O histórico de consultas vinculado a este animal também será removido e não poderá ser recuperado.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cancelDelete()">Cancelar</button>
        <button type="button" class="btn btn-danger" (click)="confirmDeletePet()">
          <i class="bi bi-trash-fill me-1"></i>Sim, Excluir Pet
        </button>
      </div>
    </div>
  </div>
</div>
